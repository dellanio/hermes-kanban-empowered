# Example entry for the curated Hermes plugin catalog (plugin-catalog/<name>.yaml in the Hermes repo).
# Field names follow hermes_cli/plugin_catalog.py (entry_from_mapping). The card banner comes ONLY from
# `image` here; plugin.yaml has no image field. Pin `sha` to the exact commit being submitted and point
# `image` at the same commit so the card is as immutable as the pin.
name: kanban-empowered
title: "Kanban Empowered"
repo: https://github.com/dellanio/hermes-kanban-empowered
sha: "0000000000000000000000000000000000000000"   # 40-hex commit SHA to pin (placeholder)
description: "Makes the Hermes kanban work for a fleet of agent profiles and a human in the loop: human waits with an owner, deadline and Telegram reminders, item-linked replies that unblock cards, guard alerts for stuck cards, infrastructure-failure recovery within a per-card budget, a pinned live panel and explain/status commands. Ships an optional core patch that adds kanban veto hooks. Disclosure: reads and writes only its own SQLite state under plugin-data/kanban-empowered; calls the Telegram Bot API (sendMessage, editMessageText, pinChatMessage) with the gateway's TELEGRAM_BOT_TOKEN; no other network access, no telemetry."
maintainer: dellanio
tier: community
category: automation
requires_hermes: ">=0.22"
docs_url: https://github.com/dellanio/hermes-kanban-empowered#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/dellanio/hermes-kanban-empowered/<sha-or-branch>/docs/assets/banner.jpg
readme: true
capabilities:
  provides_tools: []
  provides_hooks:
    - on_kanban_dispatch_tick
    - on_kanban_worker_exited
    - pre_gateway_dispatch
    - pre_tool_call
  provides_middleware: []
  requires_env: []
